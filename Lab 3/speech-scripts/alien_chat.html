<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alien Conversation</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9f1f2;
      --muted: #91a7aa;
      --panel: #122125;
      --line: #294044;
      --human: #164a4b;
      --alien: #31305d;
      --accent: #8be3c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #091214;
      color: var(--ink);
      font: 16px/1.5 Georgia, serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 18px;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 400;
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
    }

    #status {
      color: var(--accent);
      font: 700 0.85rem/1.2 sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #conversation {
      display: grid;
      gap: 14px;
      padding: 0;
    }

    .camera {
      width: 100%;
      max-width: 1080px;
      margin: 24px auto 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #000;
    }

    .camera img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .snapshots {
      width: 100%;
      max-width: 1080px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px auto 28px;
    }

    .snapshots img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
      border-radius: 6px;
      object-fit: cover;
    }

    .message {
      max-width: 82%;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      white-space: pre-wrap;
    }

    .message.alien {
      justify-self: start;
      background: var(--alien);
    }

    .message.user {
      justify-self: end;
      background: var(--human);
    }

    .dialogue-window {
      max-height: 460px;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 33, 37, 0.72);
      scroll-behavior: smooth;
    }

    .dialogue-window #status {
      margin-bottom: 16px;
    }

    .label {
      display: block;
      color: var(--muted);
      font: 700 0.72rem/1.2 sans-serif;
      letter-spacing: 0.1em;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .message {
        max-width: 94%;
      }

      main {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Alien Conversation</h1>
      <p class="subtitle">A live transcript of the exchange.</p>
    </header>
    <section class="camera" aria-label="Live camera view">
      <img src="/camera" alt="Live camera view">
    </section>
    <section id="snapshots" class="snapshots" aria-label="Screenshots from the latest response"></section>
    <section class="dialogue-window" aria-label="Recent chat history">
      <div id="status">Starting</div>
      <div id="conversation" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const conversation = document.querySelector('#conversation');
    const snapshots = document.querySelector('#snapshots');
    const status = document.querySelector('#status');
    let rendered = 0;
    let snapshotVersion = -1;

    function renderSnapshots(images) {
      snapshots.replaceChildren();
      for (const image of images) {
        const element = document.createElement('img');
        element.src = image;
        element.alt = 'Screenshot captured during the latest response';
        snapshots.append(element);
      }
    }

    async function refresh() {
      try {
        const response = await fetch('/dialogue', { cache: 'no-store' });
        const state = await response.json();
        status.textContent = state.status;
        if (state.snapshot_version !== snapshotVersion) {
          snapshotVersion = state.snapshot_version;
          const snapshotResponse = await fetch('/snapshots', { cache: 'no-store' });
          const snapshotState = await snapshotResponse.json();
          renderSnapshots(snapshotState.images);
        }
        while (rendered < state.messages.length) {
          const message = state.messages[rendered++];
          const element = document.createElement('article');
          element.className = `message ${message.role}`;
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = message.role === 'user' ? 'You' : 'Alien';
          element.append(label, document.createTextNode(message.text));
          conversation.append(element);
        }
        conversation.parentElement.scrollTop = conversation.parentElement.scrollHeight;
      } catch (error) {
        status.textContent = 'Waiting for alien_speak.py';
      }
    }

    refresh();
    setInterval(refresh, 500);
  </script>
</body>

</html>
